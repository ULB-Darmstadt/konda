name: CI

# Run on every pull request targeting main, and on every push to main.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:

  # Job 1: Go backend checks
  # Verifies that the Go code compiles, passes vet, and is correctly formatted.
 
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download Go modules
        run: go mod download

      - name: Verify go.sum is up to date
        run: go mod verify

      - name: Check formatting (gofmt)
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$UNFORMATTED"
            echo ""
            echo "Fix with: gofmt -w ."
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Build
        run: go build -v ./...


  # Job 2: Frontend checks
  # Verifies that the Parcel/Tailwind/Alpine.js frontend builds cleanly.

  frontend:
    name: Frontend (npm / Parcel)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
